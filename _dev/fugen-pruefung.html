<!doctype html><html lang="de"><meta charset="utf-8"><title>Fugenprüfung · gleicher Filmframe</title>
<style>body{margin:20px;background:#eee;font:16px system-ui}header{display:flex;gap:15px;align-items:center;margin-bottom:16px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}h2{font-size:18px}canvas{width:100%;display:none}.detail{width:100%;display:block;background:white}label{display:flex;gap:8px}</style>
<header><strong>Vergleich bei identischem Filmframe</strong><label>Frame <input id="frame" type="number" min="0" max="120" value="85"></label><select id="material"><option value="marmor">Marmor</option><option value="original">Original</option></select><select id="size"><option value="30,60">30 × 60 · Halbverband</option><option value="60,120">60 × 120 · Kreuzfuge</option><option value="120,120">120 × 120 · Kreuzfuge</option></select><select id="grout"><option value="dunkel">Anthrazit</option><option value="hell">Hell</option></select></header>
<section><figure><h2>Vorher · geschätzte Position</h2><canvas id="before"></canvas><canvas class="detail" id="detail-before"></canvas></figure><figure><h2>Nachher · im Film gemessen</h2><canvas id="after"></canvas><canvas class="detail" id="detail-after"></canvas></figure></section><p id="status"></p>
<video id="source" muted preload="auto" style="width:260px"></video><script src="../konfigurator-neu/source-joints.js?v=3"></script><script src="../konfigurator-neu/fugen-live.js?v=7"></script><script>
const $=s=>document.querySelector(s),source=$('#source'),tracked=window.SourceJoints,before=LiveJoints($('#before')),after=LiveJoints($('#after'));
function draw(){const product=$('#material').value,format=$('#size').value,grout=$('#grout').value,state={product,wall:'hell',surfaces:{boden:{format,grout,pattern:format==='30,60'?'halb':'kreuz'},wand:{format:'60,60',grout:'hell',pattern:'kreuz'}}};window.SourceJoints=null;before.draw(source,state,source.currentTime);window.SourceJoints=tracked;after.draw(source,state,source.currentTime);for(const key of ['before','after']){const c=$('#detail-'+key),ctx=c.getContext('2d');c.width=780;c.height=430;ctx.drawImage($('#'+key),650,650,780,430,0,0,780,430);}$('#status').textContent='Frame '+Math.round(source.currentTime*24)+' / '+source.currentTime.toFixed(3)+' s';}
function seek(){source.currentTime=Number($('#frame').value)/24;source.requestVideoFrameCallback(draw);}
function load(){source.src='../konfigurator-neu/assets/'+($('#material').value==='marmor'?'bad-marmor-stumm.mp4':'flur-bad-stumm.mp4');}
source.onloadeddata=seek;$('#frame').oninput=seek;$('#frame').onchange=seek;$('#material').onchange=load;$('#size').onchange=draw;$('#grout').onchange=draw;load();
</script></html>
